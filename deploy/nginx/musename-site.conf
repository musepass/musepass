# The product's own domain: the site, the API and the MCP endpoint on the apex.
#
# gw.musename.xyz keeps its own vhost (deploy/nginx/musename-gateway.conf) even
# though the apex could serve everything, because that URL is baked into the
# deployed L1 resolver's constructor arguments and cannot be changed without
# redeploying the resolver and asking the root name owner to sign again.
#
# Install to /etc/nginx/conf.d/musename-site.conf, then `nginx -t && systemctl
# reload nginx`, then certbot --nginx -d musename.xyz.

upstream musename_web_site {
    server 127.0.0.1:8803;
    keepalive 8;
}

upstream musename_api_site {
    server 127.0.0.1:8801;
    keepalive 8;
}

upstream musename_mcp_site {
    server 127.0.0.1:8802;
    keepalive 8;
}

server {
    server_name musename.xyz;

    location /mcp {
        proxy_pass http://musename_mcp_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass http://musename_api_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://musename_web_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/musename.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/musename.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = musename.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name musename.xyz;
    return 404; # managed by Certbot


}