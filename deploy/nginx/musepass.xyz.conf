# The product's own domain after the rename. Same shape as the musename.xyz
# vhost: the site, the API and the MCP endpoint on the apex, with the signer
# under /signer/ so an agent can reach it from a cloud bot.
#
# The gateway vhost (gw.musename.xyz) stays separate on purpose: that hostname is
# baked into the constructor arguments of the resolver deployed on mainnet and
# cannot be renamed without breaking every existing name.
#
# Install to /etc/nginx/conf.d/musepass.xyz.conf, then:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d musepass.xyz -d www.musepass.xyz

upstream musepass_web { server 127.0.0.1:8803; keepalive 8; }
upstream musepass_api { server 127.0.0.1:8801; keepalive 8; }
upstream musepass_mcp { server 127.0.0.1:8802; keepalive 8; }

server {
    listen 80;
    server_name musepass.xyz www.musepass.xyz;

    location /signer/ {
        proxy_pass http://127.0.0.1:8804/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /mcp {
        proxy_pass http://musepass_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass http://musepass_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://musepass_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
