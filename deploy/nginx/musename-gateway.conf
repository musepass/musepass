# MuseName public surface, all on one host so no extra DNS is needed:
#   /{sender}/{data}  CCIP-Read gateway (the L1 resolver points here)
#   /mcp              MCP server, so AI clients get HTTPS
#   /v1/              REST API, so the site and third parties get HTTPS
#
# Path prefixes win over "/" because nginx prefers the longest match, and the
# CCIP-Read path always starts with an address, so nothing collides.

upstream musename_gateway {
    server 127.0.0.1:8791 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:8792 max_fails=2 fail_timeout=5s;
    keepalive 16;
}
upstream musename_api { server 127.0.0.1:8801; keepalive 8; }
upstream musename_mcp { server 127.0.0.1:8802; keepalive 8; }

server {
    listen 80;
    server_name gw.musename.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gw.musename.xyz;

    ssl_certificate     /etc/letsencrypt/live/gw.musename.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gw.musename.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /mcp {
        proxy_pass http://musename_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass http://musename_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # The public site is a separate process on 8803. It gets explicit path
    # prefixes so the catch-all "/" below can stay a CCIP-Read gateway.
    location /_next/     { proxy_pass http://127.0.0.1:8803; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /verify      { proxy_pass http://127.0.0.1:8803; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /anchors     { proxy_pass http://127.0.0.1:8803; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /setup      { proxy_pass http://127.0.0.1:8803; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /claim      { proxy_pass http://127.0.0.1:8803; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /confirm/   { proxy_pass http://127.0.0.1:8803; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /name/      { proxy_pass http://127.0.0.1:8803; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /developers { proxy_pass http://127.0.0.1:8803; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /privacy    { proxy_pass http://127.0.0.1:8803; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /terms      { proxy_pass http://127.0.0.1:8803; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /favicon.ico { proxy_pass http://127.0.0.1:8803; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    location / {
        proxy_pass http://musename_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
