name: CI

# Every acceptance criterion in this repo is executable, so CI is the cheapest
# way to keep them true: types, unit tests, contract tests, and the local
# end-to-end run that boots the chain, the API, the MCP server, the gateway and
# the site against each other.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # Builds first: packages/core is consumed as compiled output by the apps,
      # so type checking a fresh clone without this fails for the wrong reason.
      - name: build
        run: pnpm build

      - name: typecheck
        run: pnpm -r --if-present typecheck

      - name: test
        run: pnpm -r --if-present test

  contracts:
    name: contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: forge test
        working-directory: contracts
        run: forge test -vv

  end-to-end:
    name: local end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: foundry-rs/foundry-toolchain@v1

      - name: install
        run: pnpm install --frozen-lockfile

      # Boots anvil, deploys the local stack, mints a name, then starts the API,
      # the MCP server, the gateway and the site and asserts all 26 properties.
      - name: verify:local
        run: ./scripts/verify-local.sh

      # The resolution test forks Sepolia, so it needs RPC access. It is the one
      # check that can fail for reasons outside this repository.
      - name: verify:resolution
        continue-on-error: true
        run: pnpm verify:resolution
